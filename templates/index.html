<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medya Dönüştürücü</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; max-width: 500px; width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; }
        h2 { margin-top: 0; color: #1a1a1a; text-align: center; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: #444; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0052a3; }
        button:disabled { background: #999; cursor: not-allowed; }
        #preview { margin-top: 20px; display: none; border-top: 1px solid #eee; padding-top: 16px; }
        #preview img { width: 100%; border-radius: 8px; margin-bottom: 10px; }
        .video-meta { font-size: 14px; color: #333; margin-bottom: 12px; font-weight: 500; }
        .options-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .options-row > div { flex: 1; }
        .status { margin-top: 12px; font-size: 13px; text-align: center; color: #666; }
    </style>
</head>
<body>

<div class="card">
    <h2>Medya Dönüştürücü</h2>
    
    <div class="input-group">
        <label for="urlInput">YouTube Bağlantısı:</label>
        <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
    </div>
    <button id="fetchBtn" onclick="fetchInfo()">Bilgileri Getir</button>
    <div id="statusText" class="status"></div>

    <div id="preview">
        <img id="thumb" src="" alt="Thumbnail">
        <div id="videoTitle" class="video-meta"></div>

        <div class="options-row">
            <div>
                <label for="formatSelect">Format:</label>
                <select id="formatSelect" onchange="toggleQualityOptions()">
                    <option value="mp4">Video (MP4)</option>
                    <option value="mp3">Müzik / Ses (MP3)</option>
                </select>
            </div>
            <div id="qualityWrapper">
                <label for="qualitySelect">Kalite:</label>
                <select id="qualitySelect"></select>
            </div>
        </div>

        <button id="downloadBtn" onclick="startDownload()">İndir</button>
    </div>
</div>

<script>
    let currentUrl = '';

    async function fetchInfo() {
        const url = document.getElementById('urlInput').value.trim();
        const status = document.getElementById('statusText');
        const btn = document.getElementById('fetchBtn');
        const preview = document.getElementById('preview');

        if (!url) {
            status.textContent = 'Lütfen geçerli bir bağlantı girin.';
            return;
        }

        btn.disabled = true;
        status.textContent = 'Video bilgileri alınıyor...';
        preview.style.display = 'none';

        try {
            const res = await fetch('/api/info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            const data = await res.json();
            if (data.error) throw new Error(data.error);

            currentUrl = url;
            document.getElementById('thumb').src = data.thumbnail;
            document.getElementById('videoTitle').textContent = data.title;

            const qSelect = document.getElementById('qualitySelect');
            qSelect.innerHTML = '';
            (data.resolutions.length ? data.resolutions : ['720p', '480p', '360p']).forEach(res => {
                const opt = document.createElement('option');
                opt.value = res;
                opt.textContent = res;
                qSelect.appendChild(opt);
            });

            preview.style.display = 'block';
            status.textContent = '';
        } catch (err) {
            status.textContent = 'Hata: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    function toggleQualityOptions() {
        const format = document.getElementById('formatSelect').value;
        document.getElementById('qualityWrapper').style.display = (format === 'mp3') ? 'none' : 'block';
    }

    function startDownload() {
        const format = document.getElementById('formatSelect').value;
        const quality = document.getElementById('qualitySelect').value;
        const downloadUrl = `/api/download?url=${encodeURIComponent(currentUrl)}&format=${format}&quality=${quality}`;
        
        document.getElementById('statusText').textContent = 'Dönüştürme ve indirme başlatıldı, lütfen bekleyin...';
        window.location.href = downloadUrl;
    }
</script>

</body>
</html>
